<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QB Lapraces</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
    <body>
        <div class="container">
            <div class="ui">
                <div class="editor">
                    <span id="editor-racename">Corrida: Teste</span>
                    <span id="editor-checkpoints">Checkpoints: 1 / ?</span>
                    <span id="editor-keys-add"><span style="color: rgb(0, 201, 0);">7</span> - Adicionar checkpoint</span>
                    <span id="editor-keys-tiredistance"></span>
                    <span id="editor-keys-delete"></span>
                    <span id="editor-keys-cancel"><span style="color: rgb(255, 43, 43);">9</span> - Cancelar editor</span>
                    <span id="editor-keys-save"><span style="color: rgb(0, 201, 0);">K</span> - Guardar corrida</span>
                </div>

                <div class="race">
                    <span id="race-racename">Corrida: Teste</span>
                    <span id="race-checkpoints">Checkpoints: 1 / 1</span>
                    <span id="race-lap">Volta: 1 / 1</span>
                    <span id="race-time">Volta atual: </span>
                    <span id="race-besttime">Melhor volta: </span>
                    <span id="race-totaltime">Tempo total: </span>
                </div>
            </div>
        </div>
    </body>
    <script src="./script.js"></script>
</html>
